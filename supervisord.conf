; Upstream docs/docker/spug.ini (Spug v4.1.2) plus: a pidfile, log size caps (logs live on the
; /data volume), the worker/monitor/scheduler loops in one process (spug-background.py),
; autorestart for every program (upstream leaves a child that exits 0 stopped)
; and the fatal-exit listener for Railway's restart policy.
[supervisord]
nodaemon=true
pidfile=/run/supervisord.pid
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=5MB
logfile_backups=1

[unix_http_server]
file=/run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:redis]
command = redis-server /etc/redis.conf
autostart = true
autorestart = true

[program:spug-api]
command = sh /data/spug/spug_api/tools/start-api.sh
autostart = true
autorestart = true
stdout_logfile = /data/spug/spug_api/logs/api.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups = 2
redirect_stderr = true

[program:spug-ws]
command = sh /data/spug/spug_api/tools/start-ws.sh
autostart = true
autorestart = true
stdout_logfile = /data/spug/spug_api/logs/ws.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups = 2
redirect_stderr = true

[program:spug-background]
; upstream runs spug-worker, spug-monitor and spug-scheduler as three processes; one process
; with three threads holds the same loops in about a third of the memory (spug-background.py)
command = python3 /usr/local/bin/spug-background.py
autostart = true
autorestart = true
startsecs = 5
stdout_logfile = /data/spug/spug_api/logs/background.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups = 2
redirect_stderr = true

[eventlistener:fatal-exit]
command = python3 /usr/local/bin/fatal-listener.py
events = PROCESS_STATE_FATAL
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
